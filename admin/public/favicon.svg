<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="admin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07100C"/>
      <stop offset="100%" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="admin-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow-admin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#admin-bg)" stroke="#10B981" stroke-width="12" stroke-opacity="0.4"/>

  <!-- Admin Shield Badge Shape -->
  <path d="M256,70 L400,120 V260 C400,360 256,435 256,435 C256,435 112,360 112,260 V120 Z" fill="none" stroke="url(#admin-emerald)" stroke-width="18" stroke-linejoin="round" filter="url(#glow-admin)"/>

  <!-- Key Hole / Admin Crown Emblem -->
  <circle cx="256" cy="210" r="40" fill="url(#admin-emerald)"/>
  <polygon points="236,220 276,220 286,330 226,330" fill="url(#admin-emerald)"/>
</svg>
