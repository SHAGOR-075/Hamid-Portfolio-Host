<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B08"/>
      <stop offset="100%" stop-color="#0E1C15"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#10B981" stroke-width="12" stroke-opacity="0.3"/>
  
  <!-- Glowing Outer Hexagon Ring -->
  <polygon points="256,40 436,144 436,352 256,456 76,352 76,144" fill="none" stroke="url(#emerald-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Monogram Text AHK -->
  <text x="256" y="295" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="160" font-weight="900" fill="url(#emerald-grad)" text-anchor="middle" letter-spacing="-6">AHK</text>
  
  <!-- Top Sparkle Dot -->
  <circle cx="256" cy="115" r="16" fill="#34D399"/>
</svg>
